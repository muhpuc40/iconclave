<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- i -->
  <text x="0" y="46" font-family="Space Grotesk, Manrope, sans-serif" font-size="48" font-weight="700" fill="#111111" letter-spacing="-2">i</text>
  <!-- C with gradient -->
  <text x="20" y="46" font-family="Space Grotesk, Manrope, sans-serif" font-size="48" font-weight="700" fill="url(#logoGrad)" letter-spacing="-2">C</text>
  <!-- ONCLAVE -->
  <text x="52" y="46" font-family="Space Grotesk, Manrope, sans-serif" font-size="48" font-weight="700" fill="#111111" letter-spacing="-2">ONCLAVE</text>
  <!-- Geometric accent fragment -->
  <rect x="240" y="8" width="4" height="4" fill="#1455D9" opacity="0.8"/>
  <rect x="248" y="8" width="4" height="4" fill="#6633CC" opacity="0.6"/>
  <rect x="248" y="16" width="4" height="4" fill="#C5229E" opacity="0.5"/>
  <line x1="240" y1="6" x2="252" y2="6" stroke="#1455D9" stroke-width="1" opacity="0.4"/>
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1455D9"/>
      <stop offset="50%" stop-color="#6633CC"/>
      <stop offset="100%" stop-color="#C5229E"/>
    </linearGradient>
  </defs>
</svg>
